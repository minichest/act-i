name: Fetch Latest Git Activity

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update-tracker:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fetch from GitHub API
        env:
          TRACKER_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          cd act-1.3
          curl -s -H "Authorization: ***" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/users/minichest/events > temp-events.json

          node --input-type=module -e "
            import fs from 'fs';
            const data = JSON.parse(fs.readFileSync('temp-events.json', 'utf8'));
            const pushes = data.filter(e => e.type === 'PushEvent').slice(0, 10);
            const results = [];
            for (const p of pushes) {
              const repo = p.repo.name;
              const sha = p.payload.head;
              try {
                const resp = await fetch('https://api.github.com/repos/' + repo + '/commits/' + sha, {
                  headers: { 'Authorization': 'Bearer ' + process.env.TRACKER_TOKEN, 'Accept': 'application/vnd.github+json' }
                });
                const commit = await resp.json();
                results.push({ message: (commit.commit ? commit.commit.message : 'System update').replace(/\n/g, ' '), repo, sha });   
              } catch(e) {
                results.push({ message: 'System update' });
              }
            }
            fs.writeFileSync('github-data.json', JSON.stringify(results, null, 2));
          "

      - name: Commit and Push Data File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "system: synced recent git tracking matrix [skip ci]"
          file_pattern: 'act-1.3/github-data.json'   