name: Fetch Latest Git Activity

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Saved specifically inside the act-1.3 directory
      - name: Fetch from GitHub API
        env:
          # This safely injects your secret into a standard environment variable
          TRACKER_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $TRACKER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/minichest/events > act-1.3/github-data.json


      # Step 3: Tracks and pushes the file within the subdirectory
      - name: Commit and Push Data File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@://github.com'
          
          git add act-1.3/github-data.json
          git commit -m "system: synced recent git tracking matrix [skip ci]" || exit 0
          git push
