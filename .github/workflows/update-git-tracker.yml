name: Fetch Latest Git Activity

on:
  schedule:
    - cron: '0 * * * *' 
  workflow_dispatch: 

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Saved specifically inside the act-1.3 directory
      - name: Fetch from GitHub API
        env:
          # This safely injects your secret into a standard environment variable
          TRACKER_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $TRACKER_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/users/minichest/events > act-1.3/github-data.json

      # Step 3: Automatically syncs and commits the data file safely without clashing
      - name: Commit and Push Data File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "system: synced recent git tracking matrix [skip ci]"
          file_pattern: 'act-1.3/github-data.json'

